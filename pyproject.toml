[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "planning-structs"
version = "0.1.0"
description = "Typed STRIPS planning structures: domains, groundings, symbolic action models and traces"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Kai Xi" },
  { name = "Stephen Gould" },
  { name = "Sylvie Thiébaux" },
]
keywords = ["planning", "STRIPS", "PDDL", "action models"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/xikaioliver/planning-structs"
Issues = "https://github.com/xikaioliver/planning-structs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/planning_structs"]

[tool.hatch.build.targets.sdist]
include = ["src/planning_structs", "tests", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
